<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | UniAttend 360 - Smt. C.H.M. College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0B1326; color: #DAE2FD; font-family: 'Inter', sans-serif; }

<body class="min-h-screen flex items-center justify-center p-4">

      <div class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-emerald-400 p-0.5 mx-auto flex items-center justify-center">
        <div class="h-full w-full bg-[#0B1326] rounded-[14px] flex items-center justify-center">
          <i data-lucide="shield-check" class="w-6 h-6 text-emerald-400"></i>
        </div>
      </div>
      <h2 class="text-xl font-extrabold text-white">Smt. C.H.M. College</h2>
      <p class="text-xs text-purple-300 font-mono">Department of Data Science • UniAttend 360</p>
    </div>

    <div class="text-center py-4">
      <p class="text-xs text-slate-400 mb-4">Redirecting to authenticated campus terminal...</p>
      <a href="/" class="inline-block w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl text-xs font-mono">
        ENTER CAMPUS PORTAL →
      </a>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
